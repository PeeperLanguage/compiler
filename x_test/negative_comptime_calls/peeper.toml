name = "negative_comptime_calls"
build = "program"

[test]
mode = "check"
outcome = "failure"
stderr_contains = [
    "[T0044]: this call cannot be evaluated at compile time",
    "src/main.peep:28:11",
    "odd number",
    "src/main.peep:29:11",
    "----- division by zero",
    "this ran more than 1000000 steps",
    "`print` calls cannot run at compile time yet",
    "src/main.peep:32:11",
    "---- range step is zero",
    "an `extern` function cannot run at compile time",
    "`back` uses `LOOP`, closing the cycle",
    "`self_call` uses `self_call`, closing the cycle",
    "`ping` uses `ping`, closing the cycle",
    "mismatched types: expected `i32`, found `bool`",
    "the value of a constant must be known at compile time",
    "index out of bounds: the length is 3",
    "index out of bounds of the slice",
    "array literal needs exactly 2 values",
    "return @a == @b;\n    |            -------- an address is known only when the program runs",
    "return same_pointer(@n);\n    |     ------------------------ an address is known only when the program runs",
    "let bytes = @n as *u8;\n    |                 --------- a pointer cast cannot run at compile time, as it could read an address",
    "let back = raw as *i32;\n    |                ----------- a pointer cast cannot run at compile time, as it could read an address",
    "return gives_pointer().*;\n    |            ----------------- this reads or writes memory the program does not own",
    "ended.* = 5;\n    |     ------------ this reads or writes memory the program does not own",
    "return ended.* + held.*;\n    |            ------- this reads or writes memory the program does not own",
    "return own_parameter(1).*;\n    |            ------------------ this reads or writes memory the program does not own",
    "return outlived.*;\n    |            ---------- this reads or writes memory the program does not own",
    "            return earlier.*;\n    |                    --------- this reads or writes memory the program does not own",
    "        return earlier.*;\n    |                ---------",
    "return nothing.*;\n    |            --------- this reads or writes memory the program does not own",
    "this ran out of stack",
    "this went 100000 calls deep",
    "a constant cannot hold a mutable reference, as all its uses would share one value",
    "`given` gets its value only when the program runs",
    "`later` gets its value only when the program runs",
    "a constant cannot hold a struct yet",
    "a constant cannot hold an array yet",
    "a constant cannot hold a range yet",
    "src/main.peep:169:23",
    "`after_len` gets its value only when the program runs",
    "this value cannot be worked out at compile time yet",
    "src/main.peep:178:16",
    "return wide_calls(n + 1) + 1;\n    |            ----------------- this ran out of stack",
    "        values = held;\n    |                  ---- this ran more than 1000000 steps",
    "let values = [400000]i32{(0..400000)...};\n    |                      --------------------------- this ran more than 1000000 steps",
    "Compilation failed with 42 error(s)",
]
