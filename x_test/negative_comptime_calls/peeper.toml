name = "negative_comptime_calls"
build = "program"

[test]
mode = "check"
outcome = "failure"
stderr_contains = [
    "[T0044]: this call cannot be evaluated at compile time",
    "src/main.peep:28:11",
    "odd number",
    "src/main.peep:29:11",
    "----- division by zero",
    "this ran more than 1000000 steps",
    "`print` calls cannot run at compile time yet",
    "src/main.peep:32:11",
    "---- range step is zero",
    "an `extern` function cannot run at compile time",
    "`back` uses `LOOP`, closing the cycle",
    "`self_call` uses `self_call`, closing the cycle",
    "`ping` uses `ping`, closing the cycle",
    "mismatched types: expected `i32`, found `bool`",
    "the value of a constant must be known at compile time",
    "index out of bounds: the length is 3",
    "index out of bounds of the slice",
    "array literal needs exactly 2 values",
    "this reads or writes memory the program does not own",
    "this ran out of stack",
    "this went 100000 calls deep",
    "a constant cannot hold this value yet",
    "return wide_calls(n + 1) + 1;\n    |            ----------------- this ran out of stack",
    "let values = [2]i32{forged.*...};\n    |                  ------------------- division by zero",
    "return forged.*.*.second;\n    |            ----------------- this reads or writes memory the program does not own",
    "        values = held;\n    |                  ---- this ran more than 1000000 steps",
    "let values = [400000]i32{(0..400000)...};\n    |                      --------------------------- this ran more than 1000000 steps",
    "Compilation failed with 24 error(s)",
]
