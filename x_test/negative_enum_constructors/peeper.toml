name = "negative_enum_constructors"
build = "lib"

[test]
mode = "check"
outcome = "failure"
stderr_contains = ["missing struct literal field `value`", "duplicate struct literal field `value`", "unknown struct literal field `item`", "payloadless enum variant `Pending` does not accept a payload", "data enum variant `Ok` requires a payload", "enum variants are not callable"]
