name = "negative_missing_comma_in_lists"
build = "program"

[test]
mode = "check"
outcome = "failure"
stderr_contains = ["  = help: add missing `,`\n  | \n1 | struct Pair<T, U> {\n", "  = help: add missing `,`\n  | \n6 | type Combine = fn(i32, i32) -> i32;\n", "expected ':' after parameter name", "  = help: add missing `:`\n  | \n8 | fn Scale(value: i32, factor: i32) -> i32 {\n", "  = help: add the missing commas\n   | \n17 |     let total = Sum(1, 2, 3);\n", "  = help: add the missing commas\n   | \n19 |         1,\n20 |         2,\n", "Compilation failed with 5 error(s)"]
stderr_excludes = ["\n\n\n", "wrong number of arguments", "expected ')'"]
