name = "negative_range_values"
build = "program"

[test]
mode = "check"
outcome = "failure"
stderr_contains = [
    "struct, array, range and slice parameters and results of `extern` functions are not supported yet",
    "a range's values must be integers, found `f32`",
    "`range` needs the type of its values: `range[T]`",
    "unknown type `Nope`",
    "`i32` takes no type in brackets",
    "ranges without both ends are not supported yet",
    "a range needs constant ends and step; write the length",
    "`range[i32]` cannot be printed",
    "mismatched types: expected `range[i64]`, found `range[u8]`",
    "this value cannot be worked out at compile time yet",
    "Compilation failed with 10 error(s)",
]
