name = "negative_references"
build = "program"

[test]
mode = "check"
outcome = "failure"
stderr_contains = [
    "references and slices in struct fields are not supported yet",
    "references to references are not supported yet",
    "borrows of values that are not in a variable are not supported yet",
    "cannot assign to `r.x` through shared reference `r`",
    "cannot mutably borrow `r.y` through shared reference `r`",
    "make `r` a `&mut` reference",
    "cannot mutably borrow immutable `p`",
    "`.*` needs a reference or a typed raw pointer, found `i32`",
    "cannot mutably borrow immutable `later`",
    "operator `-` cannot be applied to `&i32`",
    "let negated = -count.*;",
    "operator `+` cannot be applied to `&i32`",
    "add `.*` to use the value it points to",
    "return count.* + 1;",
    "let sum = (&n).* + 1;",
    "operator `+` cannot be applied to `&Point`",
    "mismatched types: expected `i64`, found `&i32`",
    "let wide: i64 = count.*;",
    "let sum = 1 + count.*;",
    "let called = take(count.*);",
    "return count.*;",
    "a shift count must be an integer, found `&i32`",
    "let shifted = 1 << count.*;",
    "Compilation failed with 17 error(s)",
]
