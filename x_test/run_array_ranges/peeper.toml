outcome = "exit_code"
exit_code = 0
stdout_contains = [
    "0..=255: 256 256 255 255\n",
    "-128..=127: 256 256 -128 127\n",
    "250..255:10: [250] [250] 1\n",
    "5..=0:2: [5, 3, 1] [5, 3, 1] 3\n",
    "0..3:5: [0] [0] 1\n",
    "0..0: [] [] 0\n",
    "5..2: [5, 4, 3] [5, 4, 3] 3\n",
    "mixed: [1, 10, 11, 12, 20] [1, 10, 11, 12, 20]\n",
    "places: [0, 1, 2] [7, 8, 9] [7, 8, 9] 5 24\n",
    "set: [0, 0, 0] [7, 8, 9] [7, 8, 9]\n",
    "sizes: [0, 1, 2] [-2, -1]\n",
]
