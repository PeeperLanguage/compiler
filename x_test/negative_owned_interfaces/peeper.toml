name = "negative_owned_interfaces"
build = "program"

[test]
mode = "check"
outcome = "failure"
stderr_contains = [
    "a `Shape` result needs a parameter to come from: a struct the function moves into it is gone once it returns",
    "main.peep:16:17\n",
    "returns an interface holding a temporary value, which is gone once the function returns",
    "main.peep:23:5\n",
    "`square` is used after it was moved",
    "main.peep:29:13\n",
    "`s` is used after it was moved",
    "main.peep:34:25\n",
    "cannot mutably borrow immutable `s`",
    "main.peep:39:5\n",
    "`s` is moved while a reference to it is still in use",
    "main.peep:45:13\n",
    "`retire` takes `self` whole, so it cannot be called through `&Shape`",
    "main.peep:51:18\n",
    "a temporary value is gone while a `&mut` reference to it is still in use",
    "main.peep:71:5\n",
    "a temporary value is changed while a `&mut` reference to it is still in use",
    "main.peep:79:16\n",
    "a result holding references needs a parameter that holds one",
    "main.peep:88:14\n",
    "cannot move a field out of its struct",
    "main.peep:94:13\n",
    "cannot move an element out of its array",
    "main.peep:99:17\n",
    "assignments of references through a reference are not supported yet",
    "main.peep:103:5\n",
    "main.peep:109:18\n",
    "Compilation failed with 14 error(s)",
]
