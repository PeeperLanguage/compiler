name = "negative_array_loops"
build = "program"

[test]
mode = "check"
outcome = "failure"
stderr_contains = [
    "cannot move an element out of its array",
    "loop over `&points` for a reference to each element",
    "`values` is changed while a `&mut` reference to it is still in use",
    "`values` is read while a `&mut` reference to it is still in use",
    "`for` over values other than ranges, arrays and slices are not supported yet",
    "unknown name `missing`",
    "expected `bool`, found `i32`",
    "cannot assign to `value.*` through shared reference `value`",
    "`s` is read while a `[&mut]` slice of it is still in use",
    "`s` is changed while a `[&mut]` slice of it is still in use",
    "`s` is borrowed while a `[&mut]` slice of it is still in use",
    "`s` is borrowed as `[&mut]` while a `&mut` reference to it is still in use",
    "cannot assign to `v.*` through shared reference `v`",
    "Compilation failed with 12 error(s)",
]
