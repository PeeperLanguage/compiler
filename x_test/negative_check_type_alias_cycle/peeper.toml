name = "negative_check_type_alias_cycle"
build = "program"

[test]
mode = "check"
outcome = "failure"
stderr_contains = [
    "T0013",
    "`First` is an alias of itself",
    "`First` is an alias of `Second`",
    "`Second` is an alias of `First`, closing the cycle",
    "`Itself` is an alias of itself",
    "Compilation failed with 2 error(s)",
]
