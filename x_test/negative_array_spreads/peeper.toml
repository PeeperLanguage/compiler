name = "negative_array_spreads"
build = "program"

[test]
mode = "check"
outcome = "failure"
stderr_contains = [
    "mismatched types: expected `i32`, found `range[i32]`",
    "`...` here spreads a range, an array or a slice of `u8`, found `[3]i32`",
    "`...` here spreads a range, an array or a slice of `i32`, found `i32`",
    "`[2]i32` needs 2 values, found 3",
    "a slice in `[_]` has a length known only when the program runs; write the length",
    "`...` here spreads a range, an array or a slice of `i32`, found `[&]f64`",
    "`[2]i32` needs 2 values, found at least 3",
    "`m` is borrowed while a `&mut` reference to it is still in use",
    "Compilation failed with 8 error(s)",
]
