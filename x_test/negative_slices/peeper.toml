name = "negative_slices"
build = "lib"

[test]
mode = "check"
outcome = "failure"
stderr_contains = [
    "references and slices in struct fields are not supported yet",
    "slices of slices are not supported yet",
    "slices of references are not supported yet",
    "references to slices are not supported yet",
    "arrays of slices are not supported yet",
    "struct, array, range and slice parameters and results of `extern` functions",
    "cannot assign to `view[0]` through shared slice `view`",
    "make `view` a `[&mut]` slice",
    "cannot mutably borrow immutable `fixed`",
    "mismatched types: expected `[&mut]i32`, found `[&]i32`",
    "mismatched types: expected `[&]i64`, found `&[3]i32`",
    "`[&]i32` has no field `length`",
    "`for` over values other than ranges and arrays are not supported yet",
    "cannot assign to immutable `view`",
    "a slice's `len` cannot be set",
    "literal `-1` does not fit `u64`",
    "index `-1i128` is outside every `[&]i32`",
    "index `18446744073709551616u128` is outside every `[&]i32`",
    "this call cannot be evaluated at compile time",
    "struct and array values cannot run at compile time yet",
    "Compilation failed with 18 error(s)",
]
