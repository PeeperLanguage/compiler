name = "negative_check_struct_field_write"
build = "program"

[test]
mode = "check"
outcome = "failure"
stderr_contains = [
    "cannot assign to `p.x` of immutable `p`",
    "declared without `mut` here",
    "write `let mut p`",
    "`Point` has no field `z`",
    "mismatched types: expected `i32`, found `bool`",
    "cannot assign to a temporary value",
    "Compilation failed with 4 error(s)",
]
