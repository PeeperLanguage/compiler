name = "negative_text"
build = "program"

[test]
mode = "check"
outcome = "failure"
stderr_contains = [
    "struct, array, range, slice and `str` parameters and results of `extern` functions are not supported yet",
    "operator `==` cannot be applied to `str`",
    "`str` cannot be indexed",
    "operator `+` cannot be applied to `str`",
    "`str` has no field `size`",
    "mismatched types: expected `cstr`, found `str`",
    "mismatched types: expected `str`, found `cstr`",
    "mismatched types: expected `&[]u8`, found `str`",
    "string types are not supported yet",
    "Compilation failed with 9 error(s)",
]
