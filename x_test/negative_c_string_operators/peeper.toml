name = "negative_c_string_operators"
build = "program"

[test]
mode = "check"
outcome = "failure"
stderr_contains = ["operator `==` cannot be applied to `&cstr`", "operator `-` cannot be applied to `&cstr`", "mismatched types: expected `i32`, found `&cstr`", "mismatched types: expected `&cstr`, found `&str`"]
