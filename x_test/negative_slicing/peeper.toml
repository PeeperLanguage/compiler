name = "negative_slicing"
build = "program"

[test]
mode = "check"
outcome = "failure"
stderr_contains = [
    "slice `0..5` is outside `[4]i32`, whose length is 4",
    "slice `1..=4` is outside `[4]i32`, whose length is 4",
    "slice `-1i32..2` is outside `[4]i32`, whose length is 4",
    "slice `5..` is outside `[4]i32`, whose length is 4",
    "inclusive range requires an end bound",
    "slice `..18446744073709551616u128` is outside `[4]i32`, whose length is 4",
    "slice `3..1` starts after it ends",
    "slice `3..=1` starts after it ends",
    "a slice has no step",
    "slicing borrows; write `&a[1..3]`",
    "range values as indexes are not supported yet",
    "an index must be an integer, found `f64`",
    "cannot mutably borrow `r[0..2]` through shared reference `r`",
    "cannot mutably borrow the elements of shared slice `s`",
    "slice `-1i32..` is outside every `[&]i32`",
    "slice `..18446744073709551616u128` is outside every `[&]i32`",
    "slice `2..1` starts after it ends",
    "`.*` needs a reference or a typed raw pointer, found `[&]i32`",
    "help: a slice is lent again as it is (`f(s)`), or as `&s[..]` / `&mut s[..]`",
    "slices taken through raw pointers are not supported yet",
    "borrows of values that are not in a variable are not supported yet",
    "`a` is borrowed as `[&mut]` while a `[&mut]` slice of it is still in use",
    "`s` is changed while a slice of it is still in use",
    "`s` is read while a `[&mut]` slice of it is still in use",
    "returns a slice of `a`, which is gone once the function returns",
    "returns a slice of `values`, which is gone once the function returns",
    "Compilation failed with 25 error(s)",
]
