name = "negative_reference_moves"
build = "program"

[test]
mode = "check"
outcome = "failure"
stderr_contains = [
    "T0035",
    "cannot move out of a reference or pointer",
    "let moved = point.*;",
    "borrow it instead, or read only parts that copy",
    "`first` is used after it was moved",
    "`first` is moved here",
    "`unset` is used before it is set",
    "Compilation failed with 4 error(s)",
]
