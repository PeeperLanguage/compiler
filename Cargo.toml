[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
peeper_source = { path = "crates/peeper_source" }
peeper_diagnostics = { path = "crates/peeper_diagnostics" }
peeper_lexer = { path = "crates/peeper_lexer" }
unicode-general-category = "1.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"
