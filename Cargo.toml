[workspace]
members = [
    "crates/source",
    "crates/diagnostics",
    "crates/frontend/*",
    "crates/pkg/*",
    "crates/model",
    "crates/eval",
    "crates/check",
    "crates/lower",
    "crates/flow",
    "crates/llvm",
    "crates/compile",
    "crates/project",
    "crates/lsp",
    "crates/peeper",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
source = { path = "crates/source" }
diagnostics = { path = "crates/diagnostics" }
token = { path = "crates/frontend/token" }
lexer = { path = "crates/frontend/lexer" }
arena = { path = "crates/pkg/arena" }
bigint = { path = "crates/pkg/bigint" }
parser = { path = "crates/frontend/parser" }
literal = { path = "crates/pkg/literal" }
model = { path = "crates/model" }
eval = { path = "crates/eval" }
check = { path = "crates/check" }
lower = { path = "crates/lower" }
flow = { path = "crates/flow" }
llvm = { path = "crates/llvm" }
compile = { path = "crates/compile" }
project = { path = "crates/project" }
lsp = { path = "crates/lsp" }
unicode-general-category = "1.1.0"
stacker = "0.1.25"
lsp-server = "0.7.9"
lsp-types = "0.95.1"
serde_json = "1.0.140"
toml_edit = "0.25.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"
