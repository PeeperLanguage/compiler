[package]
name = "peeper"
version = "0.1.0"
edition = "2024"
description = "The Peeper compiler"
license-file = "LICENSE"
publish = false

[dependencies]
unicode-general-category = "1.1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"
