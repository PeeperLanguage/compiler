[workspace]
members = [
    "crates/source",
    "crates/diagnostics",
    "crates/frontend/*",
    "crates/pkg/*",
    "crates/manifest",
    "crates/project",
    "crates/peeper",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
source = { path = "crates/source" }
diagnostics = { path = "crates/diagnostics" }
token = { path = "crates/frontend/token" }
literal = { path = "crates/frontend/literal" }
lexer = { path = "crates/frontend/lexer" }
ast = { path = "crates/frontend/ast" }
parser = { path = "crates/frontend/parser" }
numeric = { path = "crates/pkg/numeric" }
colors = { path = "crates/pkg/colors" }
toml = { path = "crates/pkg/toml" }
manifest = { path = "crates/manifest" }
project = { path = "crates/project" }
unicode-general-category = "1.1.0"
stacker = "0.1.25"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"
