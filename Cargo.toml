[workspace]
members = [
    "crates/base/*",
    "crates/frontend/*",
    "crates/middle/*",
    "crates/backend/*",
    "crates/driver/*",
    "crates/tools/*",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
source = { path = "crates/base/source" }
diagnostics = { path = "crates/base/diagnostics" }
token = { path = "crates/frontend/token" }
lexer = { path = "crates/frontend/lexer" }
arena = { path = "crates/base/arena" }
bigint = { path = "crates/base/bigint" }
parser = { path = "crates/frontend/parser" }
literal = { path = "crates/base/literal" }
model = { path = "crates/middle/model" }
eval = { path = "crates/middle/eval" }
check = { path = "crates/middle/check" }
lower = { path = "crates/middle/lower" }
flow = { path = "crates/middle/flow" }
llvm = { path = "crates/backend/llvm" }
compile = { path = "crates/driver/compile" }
project = { path = "crates/frontend/project" }
lsp = { path = "crates/driver/lsp" }
unicode-general-category = "1.1.0"
stacker = "0.1.25"
lsp-server = "0.7.9"
lsp-types = "0.95.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.10"
toml_edit = "0.25.13"
rustc-hash = "2.1.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Idioms from rust-style.md, kept by the `-D warnings` gate.
format_push_string = "warn"
if_not_else = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
match_bool = "warn"
needless_collect = "warn"
needless_continue = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
uninlined_format_args = "warn"

[profile.release]
debug = "line-tables-only"
