[workspace]
members = [
    "crates/base/*",
    "crates/kernel/syntax/*",
    "crates/kernel/semantic",
    "crates/kernel/model",
    "crates/kernel/lower",
    "crates/kernel/flow",
    "crates/kernel/eval",
    "crates/features",
    "crates/backend/*",
    "crates/driver/*",
    "crates/tools/*",
]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
source = { path = "crates/base/source" }
diagnostics = { path = "crates/base/diagnostics" }
token = { path = "crates/kernel/syntax/token" }
lexer = { path = "crates/kernel/syntax/lexer" }
arena = { path = "crates/base/arena" }
bigint = { path = "crates/base/bigint" }
runtime_abi = { path = "crates/base/runtime_abi" }
parser = { path = "crates/kernel/syntax/parser" }
literal = { path = "crates/base/literal" }
syntax = { path = "crates/kernel/syntax/tree" }
test_programs = { path = "crates/driver/test_programs" }
model = { path = "crates/kernel/model" }
eval = { path = "crates/kernel/eval" }
check = { path = "crates/kernel/semantic" }
lower = { path = "crates/kernel/lower" }
flow = { path = "crates/kernel/flow" }
llvm = { path = "crates/backend/llvm" }
compile = { path = "crates/driver/compile" }
features = { path = "crates/features" }
project = { path = "crates/driver/project" }
lsp = { path = "crates/driver/lsp" }
unicode-general-category = "1.1.0"
stacker = "0.1.25"
lsp-server = "0.7.9"
lsp-types = "0.95.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.10"
toml_edit = "0.25.13"
rustc-hash = "2.1.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Idioms from rust-style.md, kept by the `-D warnings` gate.
format_push_string = "warn"
if_not_else = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
match_bool = "warn"
needless_collect = "warn"
needless_continue = "warn"
ref_patterns = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
uninlined_format_args = "warn"

[profile.release]
# The phases and the features are separate crates that call each other often;
# this lets those calls be inlined (one compile ran 3% fewer instructions).
lto = "thin"
debug = "line-tables-only"

# What a web page downloads: no debug info and no symbols.
[profile.wasm]
inherits = "release"
debug = false
strip = true
