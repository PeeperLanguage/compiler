name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check, test and bundle (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash # Git Bash on Windows, for scripts/build.sh
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt clippy
      # The runtime is built with rustc for each target the tests use.
      - if: runner.os == 'Linux'
        run: rustup target add i686-unknown-linux-gnu wasm32-wasip1
      - if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnullvm
      - uses: Swatinem/rust-cache@v2
      # The i686-linux fixtures link against the 32-bit C library.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      # Holds the pack-id stamp too, so setup.sh keeps a cached pack.
      - uses: actions/cache@v4
        with:
          path: build/toolchains
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains/toolchains.lock.json') }}
      - if: runner.os != 'Windows'
        run: bash scripts/setup.sh
      - if: runner.os == 'Windows'
        run: pwsh scripts/setup.ps1
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The runtime is no workspace crate, so the two above do not see it.
      - run: rustfmt --edition 2024 --check runtime/peeper_rt.rs
      - run: clippy-driver --edition=2024 -Cpanic=abort --crate-type=staticlib --emit=metadata --out-dir target/runtime-clippy -D warnings runtime/peeper_rt.rs
      - run: cargo test --workspace --no-fail-fast # every failing crate in one run
      - run: bash scripts/build.sh
      - run: PEEPER="$PWD/build/bin/peeper" cargo test -p peeper --test fixtures
      - if: runner.os == 'Linux'
        run: |
          cargo build -p browser --profile wasm --target wasm32-wasip1
          node crates/driver/browser/smoke.mjs target/wasm32-wasip1/wasm/browser.wasm
