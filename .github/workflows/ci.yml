name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check, test and bundle (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash # Git Bash on Windows, for scripts/build.sh
    steps:
      - uses: actions/checkout@v6
      - run: rustup component add rustfmt clippy
      # The runtime is built with rustc for each target the tests use.
      - if: runner.os == 'Linux'
        run: rustup target add i686-unknown-linux-gnu wasm32-wasip1
      - if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnullvm
      - uses: Swatinem/rust-cache@v2
      # The i686-linux fixtures link against the 32-bit C library.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      # Holds the pack-id stamp too, so setup.sh keeps a cached pack.
      - uses: actions/cache@v4
        with:
          path: build/toolchains
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains/toolchains.lock.json') }}
      - if: runner.os != 'Windows'
        run: bash scripts/setup.sh
      - if: runner.os == 'Windows'
        run: pwsh scripts/setup.ps1
      - run: bash scripts/check.sh
