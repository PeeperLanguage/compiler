name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check, test and bundle (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      # The i686-linux fixtures link against the 32-bit C library.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      # Holds the pack-id stamp too, so setup.sh keeps a cached pack.
      - uses: actions/cache@v4
        with:
          path: build/toolchains
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains/toolchains.lock.json') }}
      - run: bash scripts/setup.sh
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bash scripts/build.sh
      - run: PEEPER="$PWD/build/bin/peeper" cargo test -p peeper --test fixtures
