name: Release target

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      os:
        required: true
        type: string
      arch:
        required: true
        type: string
      llvm-target:
        required: true
        type: string
      version:
        required: true
        type: string
      public-key:
        required: true
        type: string
      minimum-macos:
        required: false
        type: string
        default: "13.0"

permissions:
  contents: read

jobs:
  build:
    name: Release ${{ inputs.os }}-${{ inputs.arch }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      RELEASE_OS: ${{ inputs.os }}
      RELEASE_ARCH: ${{ inputs.arch }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_PUBLIC_KEY: ${{ inputs.public-key }}
      LLVM_TARGET: ${{ inputs.llvm-target }}
      MINIMUM_MACOS: ${{ inputs.minimum-macos }}
      CCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build compiler and bootstrap
        run: |
          test -n "$RELEASE_PUBLIC_KEY"
          bash scripts/build.sh
          expected="v$RELEASE_VERSION"
          actual="$(build/bin/peeper${{ inputs.os == 'windows' && '.exe' || '' }} --version)"
          test "$actual" = "$expected"
          mkdir -p stage/install/bin stage/install/libs stage/bootstrap
          cp "build/bin/peeper${{ inputs.os == 'windows' && '.exe' || '' }}" stage/install/bin/
          cp -R build/libs/. stage/install/libs/
          cp LICENSE stage/install/
          manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${RELEASE_VERSION}/release-manifest.json"
          go build -trimpath \
            -ldflags="-s -w -X=main.releaseManifestURL=$manifest_url -X=main.releasePublicKeyHex=$RELEASE_PUBLIC_KEY" \
            -o "stage/bootstrap/peeper-installer${{ inputs.os == 'windows' && '.exe' || '' }}" \
            ./cmd/peeper-installer

      - name: Obtain verified managed toolchain
        run: bash scripts/build-toolchain.sh "$RELEASE_OS" "$RELEASE_ARCH" "$LLVM_TARGET" stage/install/toolchains/native "$MINIMUM_MACOS"

      - name: Build target runtime
        run: |
          case "$RELEASE_OS/$RELEASE_ARCH" in
            linux/amd64) triple=x86_64-unknown-linux-musl ;;
            linux/arm64) triple=aarch64-unknown-linux-musl ;;
            darwin/amd64) triple=x86_64-apple-darwin ;;
            darwin/arm64) triple=aarch64-apple-darwin ;;
            windows/amd64) triple=x86_64-w64-windows-gnu ;;
            windows/arm64) triple=aarch64-w64-windows-gnu ;;
            *) exit 1 ;;
          esac
          suffix=""
          if [ "$RELEASE_OS" = windows ]; then suffix=.exe; fi
          clang="$GITHUB_WORKSPACE/stage/install/toolchains/native/bin/clang$suffix"
          archiver="$GITHUB_WORKSPACE/stage/install/toolchains/native/bin/llvm-ar$suffix"
          runtime_dir="stage/install/targets/$triple/lib"
          mkdir -p "$runtime_dir"
          runtime_args=(-std=c11 -O2 -target "$triple")
          if [ "$RELEASE_OS" = linux ]; then
            runtime_args+=(--sysroot "$GITHUB_WORKSPACE/stage/install/toolchains/native/sysroot")
          elif [ "$RELEASE_OS" = darwin ]; then
            runtime_args+=(--sysroot "$(xcrun --sdk macosx --show-sdk-path)" "-mmacosx-version-min=$MINIMUM_MACOS")
          fi
          "$clang" "${runtime_args[@]}" -c runtime/peeper_rt.c -o "$RUNNER_TEMP/peeper_rt.o"
          "$archiver" rcs "$runtime_dir/libpeeper_rt_v1.a" "$RUNNER_TEMP/peeper_rt.o"
          go run ./cmd/release-profile \
            -root stage/install \
            -os "$RELEASE_OS" \
            -arch "$RELEASE_ARCH" \
            ${{ inputs.os == 'darwin' && format('-minimum-os {0}', inputs.minimum-macos) || '' }}

      - name: Validate managed installation
        run: |
          compiler="$GITHUB_WORKSPACE/stage/install/bin/peeper${{ inputs.os == 'windows' && '.exe' || '' }}"
          "$compiler" doctor --json
          file "$compiler"
          PEEPER_BIN="$compiler" go test -count=1 ./x_test

      - name: Prepare release output
        run: mkdir -p dist

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: stage/install
          format: spdx-json
          output-file: dist/peeper-${{ inputs.os }}-${{ inputs.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Package final release components
        run: scripts/package-release.sh stage/install stage/bootstrap "$RELEASE_OS" "$RELEASE_ARCH" "$RELEASE_VERSION" dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ inputs.os }}-${{ inputs.arch }}
          path: dist
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
