name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PUBLIC_KEY: ${{ vars.PEEPER_RELEASE_PUBLIC_KEY }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          version="${RELEASE_TAG#v}"
          test -n "$version"
          test "v$version" = "$RELEASE_TAG"
          [[ "$RELEASE_PUBLIC_KEY" =~ ^[0-9a-fA-F]{64}$ ]]
          go test ./internal/distribution ./internal/installer ./internal/toolchain
          echo "value=$version" >> "$GITHUB_OUTPUT"

  targets:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
            llvm-target: X86
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            llvm-target: AArch64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
            llvm-target: X86
          - runner: macos-15
            os: darwin
            arch: arm64
            llvm-target: AArch64
          - runner: windows-2025
            os: windows
            arch: amd64
            llvm-target: X86
          - runner: windows-11-arm
            os: windows
            arch: arm64
            llvm-target: AArch64
    uses: ./.github/workflows/build-release-host.yml
    with:
      runner: ${{ matrix.runner }}
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      llvm-target: ${{ matrix.llvm-target }}
      version: ${{ needs.preflight.outputs.version }}
      public-key: ${{ vars.PEEPER_RELEASE_PUBLIC_KEY }}

  publish-draft:
    needs: [preflight, targets]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Assemble and sign release index
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          PEEPER_RELEASE_PRIVATE_KEY: ${{ secrets.PEEPER_RELEASE_PRIVATE_KEY }}
        run: |
          mkdir -p release-assets
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          go run ./cmd/release-index \
            -version "$RELEASE_VERSION" \
            -base-url "$base_url" \
            dist/*.tar.gz.json dist/*.zip.json \
            > release-assets/release-manifest.json
          go run ./cmd/sign-release release-assets/release-manifest.json > release-assets/release-manifest.json.sig
          find dist -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name 'peeper-installer-*' -o -name '*.spdx.json' \) \
            -exec cp {} release-assets/ \;
          (cd release-assets && sha256sum * > SHA256SUMS)
      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > "$RUNNER_TEMP/is-draft" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/is-draft")" = true
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Peeper $GITHUB_REF_NAME" --notes "Open source release candidate signed with a self-managed Ed25519 key. Verify installers, checksums, SBOMs, and GitHub attestations."
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
