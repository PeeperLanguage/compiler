name: Release host component

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      os:
        required: true
        type: string
      arch:
        required: true
        type: string
      version:
        required: true
        type: string
      minimum-macos:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build and verify ${{ inputs.os }} ${{ inputs.arch }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build compiler without host runtime
        run: go run ./scripts/bundle.go -runtime=false
      - name: Verify exact Peeper version
        run: |
          suffix=""
          [ "${{ inputs.os }}" = windows ] && suffix=.exe
          test "$(build/bin/peeper$suffix --version)" = "v${{ inputs.version }}"
      - name: Fetch verified immutable toolchain
        run: bash scripts/fetch-toolchain.sh "${{ inputs.os }}" "${{ inputs.arch }}" installation
      - name: Build native runtime
        run: |
          case "${{ inputs.os }}/${{ inputs.arch }}" in
            linux/amd64) triple=x86_64-unknown-linux-musl ;;
            linux/arm64) triple=aarch64-unknown-linux-musl ;;
            darwin/amd64) triple=x86_64-apple-darwin ;;
            darwin/arm64) triple=aarch64-apple-darwin ;;
            windows/amd64) triple=x86_64-w64-windows-gnu ;;
            windows/arm64) triple=aarch64-w64-windows-gnu ;;
            *) exit 2 ;;
          esac
          suffix=""
          [ "${{ inputs.os }}" = windows ] && suffix=.exe
          clang="$GITHUB_WORKSPACE/installation/toolchains/native/bin/clang$suffix"
          archiver="$GITHUB_WORKSPACE/installation/toolchains/native/bin/llvm-ar$suffix"
          runtime_dir="stage/compiler/targets/$triple/lib"
          mkdir -p "$runtime_dir"
          runtime_args=(-std=c11 -O2 -target "$triple")
          if [ "${{ inputs.os }}" = linux ]; then
            runtime_args+=(--sysroot "$GITHUB_WORKSPACE/installation/toolchains/native/sysroot")
          elif [ "${{ inputs.os }}" = darwin ]; then
            runtime_args+=(--sysroot "$(xcrun --sdk macosx --show-sdk-path)" "-mmacosx-version-min=${{ inputs.minimum-macos }}")
          fi
          "$clang" "${runtime_args[@]}" -c runtime/peeper_rt.c -o "$RUNNER_TEMP/peeper_rt.o"
          "$archiver" rcs "$runtime_dir/libpeeper_rt_v1.a" "$RUNNER_TEMP/peeper_rt.o"
      - name: Stage compiler component
        run: |
          suffix=""
          [ "${{ inputs.os }}" = windows ] && suffix=.exe
          mkdir -p stage/compiler/bin stage/compiler/libs dist
          cp "build/bin/peeper$suffix" stage/compiler/bin/
          cp -R build/libs/. stage/compiler/libs/
          cp LICENSE stage/compiler/
      - name: Package compiler component
        run: |
          format=tar.gz
          [ "${{ inputs.os }}" = windows ] && format=zip
          id="compiler-${{ inputs.os }}-${{ inputs.arch }}-v${{ inputs.version }}"
          archive="dist/$id.$format"
          go run ./cmd/distpack \
            -source stage/compiler \
            -output "$archive" \
            -format "$format" \
            -kind compiler \
            -id "$id" \
            -version "${{ inputs.version }}" \
            -os "${{ inputs.os }}" \
            -arch "${{ inputs.arch }}" \
            > "$archive.json"
      - name: Extract and verify final component
        run: |
          shopt -s nullglob
          records=(dist/*.tar.gz.json dist/*.zip.json)
          test "${#records[@]}" -eq 1
          record="${records[0]}"
          archive="${record%.json}"
          go run ./cmd/distunpack \
            -archive "$archive" \
            -format "$(jq -er .format "$record")" \
            -destination installation \
            -kind "$(jq -er .metadata.kind "$record")" \
            -id "$(jq -er .metadata.id "$record")" \
            -version "$(jq -er .metadata.version "$record")" \
            -os "${{ inputs.os }}" \
            -arch "${{ inputs.arch }}"
          suffix=""
          [ "${{ inputs.os }}" = windows ] && suffix=.exe
          compiler="$GITHUB_WORKSPACE/installation/bin/peeper$suffix"
          "$compiler" doctor --json
          PEEPER_BIN="$compiler" go test -count=1 ./x_test
      - uses: actions/upload-artifact@v7
        with:
          name: release-host-${{ inputs.os }}-${{ inputs.arch }}
          path: dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
