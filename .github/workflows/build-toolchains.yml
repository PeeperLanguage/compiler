name: Build Peeper toolchains

# Builds each machine's toolchain pack from the LLVM release that
# toolchains/toolchain-sources.lock.json pins, publishes it as a release of
# this repository named by its id, and opens a pull request that pins the
# packs in toolchains/toolchains.lock.json. A pack's id comes from its
# sha256, so a pack already published is not published again.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - toolchains/toolchain-sources.lock.json
      - crates/tools/toolchain/**
      - .github/workflows/build-toolchains.yml

concurrency:
  group: build-toolchains
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pack:
    name: Pack ${{ matrix.runner }}
    strategy:
      matrix:
        # shortcut: no macOS x86-64 (LLVM publishes no release for it) and
        # no Windows yet; each comes with its own row once `toolchain pack`
        # builds it.
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      # The pack's check links an i686 program on x86-64.
      - if: runner.os == 'Linux' && runner.arch == 'X64'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      # `toolchain pack` uses GNU tar's flags for a pack that is the same
      # every time, which macOS's own tar lacks, and GNU tar runs `xz` to
      # unpack the release.
      - if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install gnu-tar xz
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - id: pack
        run: echo "id=$(cargo run --release --quiet -p toolchain -- pack "$GITHUB_REPOSITORY" dist)" >> "$GITHUB_OUTPUT"
      - name: Publish the pack
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.pack.outputs.id }}
        run: |
          if gh release view "$ID" >/dev/null 2>&1; then
            echo "$ID is already published"
          else
            gh release create "$ID" "dist/$ID.tar.gz" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest=false \
              --title "Peeper $ID" \
              --notes "Peeper toolchain pack, built from $(git rev-parse --short HEAD)."
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: toolchain-record-${{ runner.os }}-${{ runner.arch }}
          path: dist/${{ steps.pack.outputs.id }}.json
          if-no-files-found: error

  lock:
    name: Pin the packs
    # Only when every pack was built, so the lock never pins half a set.
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: toolchain-record-*
          path: records
          merge-multiple: true
      - id: changed
        run: |
          cargo run --release --quiet -p toolchain -- lock records/*.json > summary.md
          if git diff --quiet -- toolchains/toolchains.lock.json; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint peeper-bot token
        id: mint-token
        if: steps.changed.outputs.value == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PEEPER_BOT_APP_ID }}
          private-key: ${{ secrets.PEEPER_BOT_PRIVATE_KEY }}
          # Without owner and repositories, the token is for this repository only.
      - name: Open lock update pull request
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ steps.mint-token.outputs.token }}
          BASE: ${{ github.ref_name }} # the branch whose lock the run updated
        run: |
          {
            echo "Pins the rebuilt toolchain packs."
            echo
            cat summary.md
            echo
            echo "Run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } > pr-body.md
          branch="automation/toolchains-${GITHUB_RUN_ID}"
          git config user.name "peeper-bot[bot]"
          git config user.email "5118601+peeper-bot[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add toolchains/toolchains.lock.json
          git commit -m "Update Peeper toolchain lock"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$branch"
          gh pr create \
            --base "$BASE" \
            --head "$branch" \
            --title "Update Peeper toolchain lock" \
            --label "Toolchain Update" \
            --reviewer itsfuad \
            --body-file pr-body.md
