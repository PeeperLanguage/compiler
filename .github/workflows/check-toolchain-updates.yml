name: Check toolchain updates

# Pins the latest upstream LLVM and llvm-mingw releases in
# toolchains/toolchain-sources.lock.json through a peeper-bot pull request;
# merging it builds the new packs (build-toolchains.yml).
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Open the update PR even when upstream sources are unchanged, to validate the bot push path
        type: boolean
        required: false
        default: false

concurrency:
  group: toolchain-source-update
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check stable upstream releases
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: activity
        name: Check recent compiler activity
        if: inputs.force != true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          active=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            active=true
          elif git log -1 --since="30 days ago" --format=%H -- \
            crates runtime _builtin_library x_test scripts Cargo.toml Cargo.lock \
            | grep -q .; then
            active=true
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "compiler_active=$active" >> "$GITHUB_STEP_SUMMARY"
      - id: existing
        name: Check existing source update pull request
        if: inputs.force != true && steps.activity.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exists="$(gh pr list --state open --search 'Update toolchain sources in:title' --json number --jq 'length > 0')"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        if: inputs.force == true || (steps.activity.outputs.active == 'true' && steps.existing.outputs.exists != 'true')
      - id: changed
        name: Pin the latest releases
        if: inputs.force == true || (steps.activity.outputs.active == 'true' && steps.existing.outputs.exists != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          cargo run --release --quiet -p toolchain -- update-sources > summary.md
          changed=false
          if [ "$FORCE" = true ] || ! git diff --quiet -- toolchains/toolchain-sources.lock.json; then
            changed=true
          fi
          echo "value=$changed" >> "$GITHUB_OUTPUT"
          echo "source_update_available=$changed" >> "$GITHUB_STEP_SUMMARY"
      - name: Mint peeper-bot token
        id: mint-token
        if: steps.changed.outputs.value == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PEEPER_BOT_APP_ID }}
          private-key: ${{ secrets.PEEPER_BOT_PRIVATE_KEY }}
          # Without owner and repositories, the token is for this repository only.
      - name: Open source update pull request
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ steps.mint-token.outputs.token }}
          BASE: ${{ github.ref_name }} # the branch whose lock the run updated
          FORCE: ${{ inputs.force }}
        run: |
          {
            echo "Updates stable upstream toolchain sources."
            echo
            cat summary.md
            echo
            echo "Merging builds the affected packs; a failed build leaves the toolchain lock unchanged."
            echo "Run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } > pr-body.md
          if [ "$FORCE" = true ]; then
            echo "Forced validation run: upstream sources may be unchanged; this PR validates the bot push path." >> pr-body.md
          fi
          branch="automation/toolchain-sources-${GITHUB_RUN_ID}"
          git config user.name "peeper-bot[bot]"
          git config user.email "5118601+peeper-bot[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add toolchains/toolchain-sources.lock.json
          git commit --allow-empty -m "Update toolchain sources"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$branch"
          gh pr create \
            --base "$BASE" \
            --head "$branch" \
            --title "Update toolchain sources" \
            --label "Toolchain Update" \
            --reviewer itsfuad \
            --body-file pr-body.md
