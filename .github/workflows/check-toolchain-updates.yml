name: Check toolchain updates

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: toolchain-source-update
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check stable upstream releases
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: activity
        name: Check recent compiler activity
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          active=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            active=true
          elif git log -1 --since="30 days ago" --format=%H -- \
            cmd internal pkg runtime x_test scripts/build.sh scripts/bundle.go go.mod go.sum \
            | grep -q .; then
            active=true
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "compiler_active=$active" >> "$GITHUB_STEP_SUMMARY"
      - id: existing
        name: Check existing source update pull request
        if: steps.activity.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exists="$(gh pr list --state open --search 'Update toolchain sources in:title' --json number --jq 'length > 0')"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - name: Resolve stable upstream metadata
        if: steps.activity.outputs.active == 'true' && steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-toolchain-sources.sh toolchains/toolchain-sources.lock.json candidate-sources.lock.json
      - id: changed
        name: Check candidate change
        if: steps.activity.outputs.active == 'true' && steps.existing.outputs.exists != 'true'
        run: |
          changed=false
          # Semantic compare: formatting-only differences must not open a PR.
          if ! jq -S . toolchains/toolchain-sources.lock.json | cmp -s - <(jq -S . candidate-sources.lock.json); then
            changed=true
          fi
          echo "value=$changed" >> "$GITHUB_OUTPUT"
          echo "source_update_available=$changed" >> "$GITHUB_STEP_SUMMARY"
      - name: Open source update pull request
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Updates stable upstream toolchain source metadata from official releases."
            echo
            echo "Auto-generated from workflow run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            cat candidate-sources.lock.json.summary
            echo
            echo "### Risk notes"
            echo "- Candidate builds run on merge; failure leaves the finished toolchain lock unchanged."
            echo "- Review upstream changelogs for changed sources before merging."
            echo
            echo "### Validation"
            echo "- [ ] Candidate toolchain builds pass (triggered on merge)"
          } > pr-body.md
          branch="automation/toolchain-sources-${GITHUB_RUN_ID}"
          mv candidate-sources.lock.json toolchains/toolchain-sources.lock.json
          git config user.name "itsfuad"
          git config user.email "fuad.cs22@gmail.com"
          git switch -c "$branch"
          git add toolchains/toolchain-sources.lock.json
          git commit -m "Update toolchain sources"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update toolchain sources" \
            --label "Toolchain Update" \
            --reviewer itsfuad \
            --body-file pr-body.md
