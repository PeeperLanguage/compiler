# A design demo, not part of the compiler's workspace: a small language
# built on the feature interface, run through every phase of the real
# pipeline, to test the design.
[workspace]
members = [
    "model",
    "gateway",
    "flow",
    "eval",
    "llvm",
    "features/bools",
    "features/integers",
    "features/operators",
    "features/bindings",
    "features/references",
    "features/functions",
    "features/members",
    "features/structs",
    "language",
    "pipeline",
]
# Paused until the core's phases are done: their code is written against
# the old interface and waits to be ported.
exclude = [
    "features/arrays",
    "features/slices",
    "features/ranges",
    "features/interfaces",
    "features/loops",
    "features/enums",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false
