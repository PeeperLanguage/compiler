# How the runtime library that every program links with is built. Only the
# compiler's own build reads this file (crates/backend/llvm/build.rs): its
# values are fixed into the compiler, which builds the library with them and
# finds it by `library` in <installation>/runtime/<target>. Changing it means
# rebuilding peeper.

# The archive's file name.
library = "libpeeper_rt_v1.a"

# The Rust file in this folder that is the library.
source = "peeper_rt.rs"

# rustc's flags. `lto` keeps only what the library uses of Rust's `core`.
flags = ["--edition=2024", "-Cpanic=abort", "-Copt-level=2", "-Ccodegen-units=1", "-Clto=fat"]
